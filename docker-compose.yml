name: runbook-studio

services:
  runbook-studio:
    build: .
    image: runbook-studio:latest
    container_name: runbook-studio
    environment:
      - VIRTUAL_HOST=runbook.landingpad.digital
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=runbook.landingpad.digital
      - LETSENCRYPT_EMAIL=dev@landingpad.digital
      # Model mode is optional. Leave MODEL_API_KEY empty and the harness stays in manual mode.
      - MODEL_API_KEY=${MODEL_API_KEY:-}
      - MODEL_BASE_URL=${MODEL_BASE_URL:-}
      - MODEL_NAME=${MODEL_NAME:-}
    networks:
      - nextcloud-net
    restart: unless-stopped

networks:
  nextcloud-net:
    external: true
